<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martı: Şehir Uçuşu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ad-container">
        <canvas id="gameCanvas" width="320" height="480"></canvas>

        <div id="ui-layer">
            <div id="start-screen">
                <div class="logo">Martı</div>
                <p>Şehri Keşfet</p>
                <div class="hand-icon">👆</div>
                <p class="instruction">Yükselmek için Basılı Tut</p>
            </div>

            <div id="game-over-screen" class="hidden">
                <h2>Varış Noktasına Ulaştın!</h2>
                <div class="score-board">
                    <p>Toplam Puan</p>
                    <p id="final-score">0</p>
                </div>
                <p id="final-message">Şehrin keyfini Martı ile çıkar.</p>
                <a href="https://www.marti.tech/" target="_blank" class="cta-button">Hemen Başla</a>
                <button id="restart-btn">Tekrar Uç</button>
            </div>

            <div id="hud" class="hidden">
                <div class="top-bar">
                    <div id="score-container">
                        <span class="icon">⚡</span> <span id="score">0</span>
                    </div>
                </div>
                <div id="progress-container">
                    <div id="progress-bar"></div>
                    <div id="progress-icon">🐦</div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
