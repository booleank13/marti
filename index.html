<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martı Playable Ad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ad-container">
        <canvas id="gameCanvas" width="320" height="480"></canvas>

        <div id="ui-layer">
            <div id="start-screen">
                <div class="logo">Martı</div>
                <p>Başlamak için Dokun</p>
                <p class="instruction">Engellerden kaçın ve pilleri topla!</p>
            </div>

            <div id="game-over-screen" class="hidden">
                <h2>Hedefe Ulaştın!</h2>
                <p id="final-score">Puan: 0</p>
                <a href="https://www.marti.tech/" target="_blank" class="cta-button">Hemen İndir</a>
                <button id="restart-btn">Tekrar Oyna</button>
            </div>

            <div id="hud" class="hidden">
                <div id="score-container">Puan: <span id="score">0</span></div>
                <div id="progress-container">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
