<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Martı: Şehir Turu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ad-container">
        <canvas id="gameCanvas" width="320" height="480"></canvas>

        <div id="ui-layer">
            <!-- Start Screen -->
            <div id="start-screen" class="screen">
                <div class="title-group">
                    <h1>MARTI</h1>
                    <p class="subtitle">ŞEHİR TURU</p>
                </div>
                <div class="tutorial">
                    <div class="tap-indicator"></div>
                    <p>Başlamak İçin Dokun</p>
                </div>
            </div>

            <!-- In-Game HUD -->
            <div id="hud" class="hidden">
                <div class="progress-container">
                    <div class="progress-track">
                        <div id="progress-fill"></div>
                    </div>
                    <div class="destination-icon"></div>
                </div>
                <div id="mode-indicator">SCOOTER MODU</div>
            </div>

            <!-- End Screen (CTA) -->
            <div id="end-screen" class="screen hidden">
                <div class="success-box">
                    <h2>HEDEFE ULAŞTIN!</h2>
                    <p>Şehir içi ulaşımın en keyifli yolu.</p>
                </div>
                <a href="https://www.marti.tech/" target="_blank" class="cta-button">HEMEN İNDİR</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
