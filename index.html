<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Martı: Şehir Turu</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ad-container">
        <canvas id="gameCanvas" width="320" height="480"></canvas>

        <div id="ui-layer">
            <!-- Start Screen -->
            <div id="start-screen">
                <div class="logo">MARTI</div>
                <div class="subtitle">Şehri Tek Araçla Geç</div>

                <div class="instruction-box">
                    <div class="hand-icon-css"></div>
                    <div class="instruction-text">Yükselmek için Basılı Tut</div>
                    <div class="instruction-text" style="font-size: 10px; color: #aaa; margin-top:5px;">TAG ile Hızlan, Scooter ile Gez</div>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden">
                <div class="logo" style="font-size: 40px;">HEDEFE VARDIN!</div>

                <div class="stat-box">
                    <div class="stat">
                        <span class="stat-label">Puan</span>
                        <span class="stat-value" id="final-score">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Mesafe</span>
                        <span class="stat-value" id="stat-distance">0m</span>
                    </div>
                </div>

                <div class="stat" style="margin-bottom: 20px;">
                    <span class="stat-label">Favori Araç</span>
                    <span class="stat-value" id="stat-mode" style="color: #26D07C">Scooter</span>
                </div>

                <a href="https://www.marti.tech/" target="_blank" class="cta-button">HEMEN İNDİR</a>
                <button id="restart-btn">Tekrar Oyna</button>
            </div>

            <!-- Heads Up Display -->
            <div id="hud" class="hidden">
                <div class="top-bar">
                    <div id="score-container">
                        <span id="score">0</span>
                    </div>
                    <div id="tag-status">TAG MODE!</div>
                </div>
                <div id="progress-container">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
